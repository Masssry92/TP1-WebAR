<!DOCTYPE html>
<html>
  <head>
    <title>TP01 - WebAR - AR.js</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script>
      AFRAME.registerComponent('color-on-click', {
        init: function () {
          var el = this.el;
          var colors = ['#4CC3D9', '#EF2D5E', '#FFC65D', '#7BC8A4'];

          el.addEventListener('click', function () {
            var randomColor = colors[Math.floor(Math.random() * colors.length)];
            el.setAttribute('color', randomColor);

            el.setAttribute('animation__pulse', {
              property: 'scale',
              from: '1 1 1',
              to: '1.5 1.5 1.5',
              dur: 250,
              dir: 'alternate',
              easing: 'easeInOutQuad'
            });
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">

      <a-marker preset="hiro">
        <a-box
          class="clickable"
          position="0 0.5 0"
          color="#4CC3D9"
          opacity="0.6"
          transparent="true"
          animation__rotate="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
          color-on-click>
        </a-box>
      </a-marker>

      <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>

    </a-scene>
  </body>
</html>
