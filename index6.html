<!DOCTYPE html>
<html>
<head>
  <title>TP01 - WebAR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #ui {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.85);
      padding: 15px 20px;
      border-radius: 10px;
      display: none;
      z-index: 999;
      text-align: center;
      font-family: sans-serif;
    }
    #ui input[type="range"] {
      width: 200px;
      display: block;
      margin: 10px auto;
    }
    .color-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-block;
      margin: 0 5px;
      cursor: pointer;
      border: 2px solid white;
    }
  </style>
</head>
<body>
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
    <a-marker preset="hiro" id="hiro-marker">
      <a-box id="ar-box" position="0 0.5 0" color="#4CC3D9" width="1" height="1" depth="1"></a-box>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <div id="ui">
    <label for="size-slider">Taille</label>
    <input type="range" id="size-slider" min="0.1" max="3.0" step="0.1" value="1">
    <div>
      <span class="color-btn" style="background: red;" data-color="#FF0000"></span>
      <span class="color-btn" style="background: green;" data-color="#00FF00"></span>
      <span class="color-btn" style="background: blue;" data-color="#0000FF"></span>
    </div>
  </div>

  <script>
    var marker = document.querySelector('#hiro-marker');
    var ui = document.querySelector('#ui');
    var box = document.querySelector('#ar-box');
    var slider = document.querySelector('#size-slider');

    marker.addEventListener('markerFound', function () {
      ui.style.display = 'block';
    });

    marker.addEventListener('markerLost', function () {
      ui.style.display = 'none';
    });

    slider.addEventListener('input', function () {
      var value = slider.value;
      box.setAttribute('scale', value + ' ' + value + ' ' + value);
    });

    document.querySelectorAll('.color-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        box.setAttribute('color', btn.getAttribute('data-color'));
      });
    });
  </script>
</body>
</html>
